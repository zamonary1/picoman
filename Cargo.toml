[package]
name = "picoman"
version = "0.1.5"
edition = "2021"
build = "build.rs"
publish = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[profile.release]
opt-level = "z"
lto = true
strip = true
# Optimize for file size

[profile.dev]
opt-level = 0
lto = false
strip = true

[dependencies]
adb_client = "2.1.13"
clap = { version = "4.5.27", features = ["derive", "cargo"] }
colored = "3.0.0"
egui = "0.30"
eframe = { version = "0.30", default-features = false, features = [
    "default_fonts",
    "x11",
    "glow",
] }
env_logger = { version = "0.10", default-features = false, features = [
    "auto-color",
    "humantime",
] }
sysinfo = "0.33.1"
thiserror = "1.0"
sha256 = "1.5.0"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
json = "0.12.4"
random-string = "1.1.0"
edit-xml = "0.1.0"
tr = "0.1.10"
strum = "0.27"
strum_macros = "0.27"
rusb = "0.9.4"
rand = "0.9.0"
native-dialog = "0.8.8"
log = "0.4.27"
log4rs = "1.3.0"
chrono = "0.4.41"
